name: cpg_mobile
description: CPG mobile companion app — browse, download offline, bookmark, and ask clinical practice guidelines.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.0

  # State management / navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Local/offline storage
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Networking / connectivity
  connectivity_plus: ^6.1.0
  http: ^1.2.2
  url_launcher: ^6.3.1

  # Rich text rendering (Tiptap JSON -> Flutter widgets)
  flutter_html: ^3.0.0

  # UX niceties
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.15
  lottie: ^3.3.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/

# Notes:
# - Run `flutter pub upgrade --major-versions` after cloning to pick up any newer
#   compatible releases; the versions above were current as of Aug 2026.
# - supabase_flutter v2.x uses `publishableKey:` in Supabase.initialize (see main.dart).
# - Run `dart run build_runner build --delete-conflicting-outputs` after editing
#   any file under lib/services/local_db to regenerate Drift's generated code.
